<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A2744" />
      <stop offset="60%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Alien Skin Gradient -->
    <linearGradient id="alienSkin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="85%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Cranial Highlight Gradient -->
    <radialGradient id="cranialGlow" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Eye Glowing Gradient -->
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="40%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <!-- Cyber Armor Gradient -->
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Neon Cyan Accents -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Base Clip Background -->
  <rect width="256" height="256" fill="url(#bgGrad)" />

  <!-- Cybernetic Aura Ring behind character -->
  <circle cx="128" cy="120" r="105" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 6" />
  <circle cx="128" cy="120" r="92" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.25" />
  
  <!-- Outer Energy Flares -->
  <circle cx="128" cy="95" r="70" fill="#0EA5E9" opacity="0.15" filter="url(#softGlow)" />

  <!-- Cyber Suit / Shoulder Armor (Bottom) -->
  <g id="cyber-armor">
    <!-- Back Collar Plate -->
    <path d="M70 215 C75 190, 181 190, 186 215 L200 256 L56 256 Z" fill="#0F172A" />
    
    <!-- Main Chest / Shoulder Armor -->
    <path d="M48 256 C52 210, 85 195, 110 190 L128 202 L146 190 C171 195, 204 210, 208 256 Z" fill="url(#armorGrad)" stroke="#475569" stroke-width="1.5" />
    
    <!-- Armor Plates & Tech Seams -->
    <path d="M80 205 L112 214 L112 256" fill="none" stroke="#0284C7" stroke-width="2" stroke-opacity="0.7" />
    <path d="M176 205 L144 214 L144 256" fill="none" stroke="#0284C7" stroke-width="2" stroke-opacity="0.7" />

    <!-- Center Reactor / Tech Core Badge -->
    <polygon points="128,212 138,226 128,240 118,226" fill="#0891B2" stroke="#22D3EE" stroke-width="1.5" filter="url(#neonFilter)" />
    <circle cx="128" cy="226" r="3.5" fill="#E0F2FE" />
  </g>

  <!-- Neck -->
  <path d="M112 165 C112 182, 116 195, 128 198 C140 195, 144 182, 144 165 Z" fill="#0369A1" stroke="#0284C7" stroke-width="1" />
  <!-- Neck tech lines -->
  <line x1="120" y1="172" x2="120" y2="188" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="136" y1="172" x2="136" y2="188" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Alien Head Structure -->
  <g id="alien-head">
    <!-- Base Head Silhouette (Iconic stylish smooth cranium) -->
    <path d="M128 35 
             C72 35, 60 85, 74 132
             C82 160, 108 178, 128 180
             C148 178, 174 160, 182 132
             C196 85, 184 35, 128 35 Z" 
          fill="url(#alienSkin)" 
          stroke="#38BDF8" 
          stroke-width="1.5" />

    <!-- Cranial 3D Volume Light & Shadow -->
    <ellipse cx="128" cy="75" rx="55" ry="38" fill="url(#cranialGlow)" />

    <!-- Biomechanical Cranial Markings / Neural Circuitry (Glowing Cyan) -->
    <g filter="url(#neonFilter)" opacity="0.85">
      <!-- Center Forehead Crest -->
      <path d="M128 44 L128 85" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="128" cy="46" r="2.5" fill="#E0F2FE" />
      <circle cx="128" cy="85" r="2.5" fill="#E0F2FE" />

      <!-- Left Temple Markings -->
      <path d="M112 55 C100 60, 92 72, 88 88" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
      <circle cx="88" cy="88" r="2" fill="#E0F2FE" />
      <path d="M118 68 C108 76, 102 88, 98 100" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" />

      <!-- Right Temple Markings -->
      <path d="M144 55 C156 60, 164 72, 168 88" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
      <circle cx="168" cy="88" r="2" fill="#E0F2FE" />
      <path d="M138 68 C148 76, 154 88, 158 100" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Sleek Brow Ridge -->
    <path d="M88 116 C105 110, 120 118, 128 118 C136 118, 151 110, 168 116" fill="none" stroke="#075985" stroke-width="3" stroke-linecap="round" />

    <!-- Eyes (Epic tilted cosmic oval cyber eyes) -->
    <!-- Left Eye Socket & Eye -->
    <g id="left-eye">
      <path d="M82 120 C96 112, 115 125, 116 138 C116 146, 96 150, 84 138 C80 132, 78 124, 82 120 Z" 
            fill="#082F49" stroke="#0369A1" stroke-width="1.5" />
      
      <!-- Glowing Iris -->
      <path d="M85 123 C96 117, 112 127, 113 137 C113 144, 97 147, 87 137 C83 133, 82 126, 85 123 Z" 
            fill="url(#eyeGlow)" filter="url(#neonFilter)" />

      <!-- Deep Pupil / Cyber Matrix Lens -->
      <ellipse cx="98" cy="133" rx="7" ry="9" fill="#02131F" />
      <circle cx="98" cy="133" r="3" fill="#22D3EE" />

      <!-- High-tech Glint Highlight -->
      <ellipse cx="93" cy="127" rx="3.5" ry="2" fill="#FFFFFF" opacity="0.9" transform="rotate(-25 93 127)" />
      <circle cx="106" cy="138" r="1.5" fill="#E0F2FE" opacity="0.8" />
    </g>

    <!-- Right Eye Socket & Eye -->
    <g id="right-eye">
      <path d="M174 120 C160 112, 141 125, 140 138 C140 146, 160 150, 172 138 C176 132, 178 124, 174 120 Z" 
            fill="#082F49" stroke="#0369A1" stroke-width="1.5" />
      
      <!-- Glowing Iris -->
      <path d="M171 123 C160 117, 144 127, 143 137 C143 144, 159 147, 169 137 C173 133, 174 126, 171 123 Z" 
            fill="url(#eyeGlow)" filter="url(#neonFilter)" />

      <!-- Deep Pupil / Cyber Matrix Lens -->
      <ellipse cx="158" cy="133" rx="7" ry="9" fill="#02131F" />
      <circle cx="158" cy="133" r="3" fill="#22D3EE" />

      <!-- High-tech Glint Highlight -->
      <ellipse cx="153" cy="127" rx="3.5" ry="2" fill="#FFFFFF" opacity="0.9" transform="rotate(-25 153 127)" />
      <circle cx="166" cy="138" r="1.5" fill="#E0F2FE" opacity="0.8" />
    </g>

    <!-- Refined Nose Bridge / Slits -->
    <path d="M125 147 L124 154" stroke="#0369A1" stroke-width="1.5" stroke-linecap="round" />
    <path d="M131 147 L132 154" stroke="#0369A1" stroke-width="1.5" stroke-linecap="round" />

    <!-- Subtle Confident Mouth / Smile -->
    <path d="M116 166 C124 171, 132 171, 140 166" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" />
    <path d="M122 168 C126 170, 130 170, 134 168" fill="none" stroke="#38BDF8" stroke-width="1" stroke-linecap="round" />

    <!-- High-tech Cheek Cyber Implants (Left and Right) -->
    <g stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.75" filter="url(#neonFilter)">
      <line x1="72" y1="140" x2="80" y2="148" />
      <line x1="70" y1="148" x2="76" y2="154" />
      
      <line x1="184" y1="140" x2="176" y2="148" />
      <line x1="186" y1="148" x2="180" y2="154" />
    </g>

    <!-- Chin Contour -->
    <path d="M120 178 C125 180, 131 180, 136 178" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Cool Sci-fi Admin Crown / Headset Device (Slim Neon Arc) -->
  <path d="M68 95 C68 45, 188 45, 188 95" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 4" />
  <circle cx="68" cy="95" r="4" fill="#0284C7" stroke="#38BDF8" stroke-width="1" />
  <circle cx="188" cy="95" r="4" fill="#0284C7" stroke="#38BDF8" stroke-width="1" />
  <circle cx="128" cy="38" r="3" fill="#38BDF8" filter="url(#neonFilter)" />

  <!-- Subtle Specular Edge Highlights -->
  <path d="M78 68 C84 50, 104 38, 128 36" fill="none" stroke="#BAE6FD" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
</svg>
